name: validate-templates
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse all YAML/JSON/XML
        run: |
          python - <<'PY'
          # Use pathlib.Path.rglob for suffix-based discovery; glob.glob's
          # brace expansion does not work on Python 3.11, which silently
          # returns []. Mirrors scripts/verify-templates.sh.
          import sys, json, xml.dom.minidom as M
          import yaml, pathlib
          bad = 0
          configs = [p for p in pathlib.Path('.').rglob('*')
                     if p.is_file() and p.suffix in ('.yml', '.yaml', '.json')]
          for f in configs:
              try:
                  if f.suffix in ('.yml', '.yaml'):
                      yaml.safe_load(f.read_text())
                  else:
                      json.loads(f.read_text())
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          poms = list(pathlib.Path('.').rglob('pom.xml'))
          for f in poms:
              try: M.parseString(f.read_text())
              except Exception as e: print("XML FAIL", f, e); bad += 1
          print(f"parsed {len(configs)} YAML/JSON + {len(poms)} pom.xml; failures={bad}")
          sys.exit(bad)
          PY
      - name: Secret pattern scan
        run: |
          # Mirror scripts/verify-templates.sh: forbid sk_live_, pk_live_, AKIA,
          # ghp_, and high-entropy Bearer tokens in tracked config + source.
          # YOUR_* placeholders are allowed.
          python - <<'PY'
          import re, sys, pathlib
          patterns = [
              r'sk_live_[A-Za-z0-9]{8,}',
              r'pk_live_[A-Za-z0-9]{8,}',
              r'AKIA[0-9A-Z]{16}',
              r'ghp_[A-Za-z0-9]{30,}',
              r'Bearer\s+[A-Za-z0-9._-]{16,}',
          ]
          # Exclude dependency + build output directories so the scan only
          # covers source/config (a base64 blob in node_modules would otherwise
          # match the Bearer pattern).
          skip_dirs = {'node_modules', 'target', 'dist', '.svelte-kit', '.next', '.git'}
          suffixes = {'.md', '.yml', '.yaml', '.json', '.ts', '.tsx',
                      '.js', '.svelte', '.py', '.java', '.xml'}
          roots = ['templates', 'scripts', '.github', 'AGENTS.md', 'README.md']
          rx = re.compile('|'.join(patterns))
          bad = 0
          for root in roots:
              rp = pathlib.Path(root)
              files = [rp] if rp.is_file() else sorted(rp.rglob('*'))
              for f in files:
                  if not f.is_file() or f.suffix not in suffixes:
                      continue
                  if any(part in skip_dirs for part in f.parts):
                      continue
                  try:
                      text = f.read_text()
                  except Exception:
                      continue
                  if 'YOUR_' in text:
                      text = re.sub(r'YOUR_[A-Za-z0-9_]+', '', text)
                  for m in rx.finditer(text):
                      print(f"FAIL {f}: matched {m.group(0)!r}")
                      bad += 1
          print(f"secret-pattern scan: failures={bad}")
          sys.exit(bad)
          PY
      - name: Python package tests
        working-directory: templates/python-package
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Setup Node toolchain (for JS templates)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SvelteKit smoke test (npm install + vitest)
        working-directory: templates/sveltekit
        run: |
          npm install --no-audit --no-fund
          npm run test
      - name: Next.js + Convex smoke test (npm install)
        working-directory: templates/nextjs-convex
        # `npm run typecheck` depends on Convex codegen output produced by
        # `npx convex dev` / `npx convex codegen` after the user wires up a
        # deployment per the template's README. We therefore only assert that
        # dependencies resolve + install.
        run: npm install --no-audit --no-fund
      - name: Setup Java toolchain (for Spring Boot template)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spring Boot API smoke test (mvn test)
        working-directory: templates/spring-boot-api
        run: mvn -q test
